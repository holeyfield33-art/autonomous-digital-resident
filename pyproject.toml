[project]
name = "autonomous-digital-resident"
version = "0.2.0"
description = "Persistent self-directed artifact creation with bounded tools and local memory"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "openai==2.46.0",
  "httpx==0.28.1",
  "pydantic==2.13.5",
  "mcp==1.30.0",
  "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.10", "pytest-cov==7.1.0"]

[project.scripts]
resident = "agent.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: requires an explicit trusted Docker image ID"]
