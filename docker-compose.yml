# Optional offline packaged demo; main live/Mneme profile runs on the host.
services:
  demo:
    build: .
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=32m]
    volumes:
      - resident-demo-data:/data
volumes:
  resident-demo-data:
